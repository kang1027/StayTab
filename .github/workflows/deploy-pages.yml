name: Deploy site to GitHub Pages

# Publishes bettercmdtab.app: the marketing site at / and the docs at /docs.
# They are two separate static exports — web/ (TanStack Start) and docs/ (Next)
# — that share one origin, so the docs export is merged into the marketing one
# before upload — the same merge the
# `Verify the merged artifact` step in ci-site.yml checks on every PR.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  # The download button and version chip render a release snapshot baked at
  # build time, so a new release has to trigger a rebuild or the site keeps
  # advertising the previous version.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the same domain, but do not cancel one that is
# already uploading — a half-finished deploy is a broken site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build both exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (web)
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install (docs)
        working-directory: docs
        run: bun install --frozen-lockfile

      # Non-fatal: GitHub's anonymous rate limit is shared per-IP across CI
      # runners, and the committed releases.json is a valid (if older) fallback.
      # A rate-limited refresh must not take the whole deploy down.
      - name: Refresh the release snapshot
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/fetch-releases.ts || echo "keeping the committed releases.json"

      - name: Build (web)
        working-directory: web
        run: bun run build

      - name: Build (docs)
        working-directory: docs
        run: bun run build

      # basePath already made every URL the docs app generates start with
      # /docs, so this is a plain file move rather than a rewrite.
      - name: Merge the docs export under /docs
        run: |
          mkdir -p web/out/docs
          cp -R docs/out/. web/out/docs/

      - name: Add the custom domain
        run: |
          echo "bettercmdtab.app" > web/out/CNAME
          # Artifact deploys are not supposed to run Jekyll, but if one ever
          # did it would drop every _next/* path as private and serve the whole
          # site unstyled. One empty file against a total-outage failure mode.
          touch web/out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
