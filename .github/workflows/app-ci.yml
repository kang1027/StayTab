name: App CI

on:
  push:
    branches: [main]
    paths:
      - "BetterCmdTab/**"
      - "BetterCmdTabTests/**"
      - "BetterCmdTab.xcodeproj/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "BetterCmdTab/**"
      - "BetterCmdTabTests/**"
      - "BetterCmdTab.xcodeproj/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Release without signing
        run: |
          xcodebuild \
            -project BetterCmdTab.xcodeproj \
            -scheme BetterCmdTab \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project BetterCmdTab.xcodeproj \
            -scheme "BetterCmdTab Debug" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            test
