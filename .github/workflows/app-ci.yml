name: App CI

on:
  push:
    branches: [main]
    paths:
      - "StayTab/**"
      - "StayTabTests/**"
      - "StayTab.xcodeproj/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "StayTab/**"
      - "StayTabTests/**"
      - "StayTab.xcodeproj/**"
      - "LICENSE"
      - "NOTICE.md"
      - "scripts/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # The Swift package graph is compiled with Xcode 26 locally. Xcode 16 on
    # macos-15 rejects BetterPermissions' async UserNotifications bridge under
    # Swift 6 strict concurrency before the StayTab target is reached.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Release without signing
        run: |
          xcodebuild \
            -project StayTab.xcodeproj \
            -scheme StayTab \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # SwitcherReflowTests deliberately open and animate a real AppKit window.
      # They stay in the local suite, where a WindowServer and Reduce Motion
      # state are available, instead of producing false failures headlessly.
      - name: Run portable tests
        run: |
          xcodebuild \
            -project StayTab.xcodeproj \
            -scheme "StayTab Debug" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:StayTabTests/SettingsPortabilityTests \
            -skip-testing:StayTabTests/SwitcherReflowTests \
            test

      # This suite mutates the process-wide Preferences singleton and the app's
      # UserDefaults domain. Keep it in its own test process so unrelated suites
      # cannot race its export/import round trips.
      - name: Run settings portability tests in isolation
        run: |
          xcodebuild \
            -project StayTab.xcodeproj \
            -scheme "StayTab Debug" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:StayTabTests/SettingsPortabilityTests \
            test
