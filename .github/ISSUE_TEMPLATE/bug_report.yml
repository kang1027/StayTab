name: Bug report
description: Report incorrect switching, focus, rendering, or settings behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve StayTab. Remove private window titles, account names, notifications, and other personal information from attachments.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the visible behavior and the app or window that remained focused.
      placeholder: I pressed ⌘Tab from Warp, selected ChatGPT, and…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open these apps and windows…
        2. Press this exact key sequence…
        3. Select this row…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The selected window should receive keyboard focus immediately.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Optional but recommended for focus, animation, grouping, or stale-frame problems.
  - type: dropdown
    id: app_version
    attributes:
      label: Application version and build
      description: Pick the release shown in Settings > About.
      options:
        # release-options:start
        - "0.1.1 (20260820192837) — latest"
        - "0.1.0 (20260820175413) — release"
        # release-options:end
        - Other / not listed
    validations:
      required: true
  - type: input
    id: other_app_version
    attributes:
      label: Other application version and build (optional)
      description: Complete this only when you selected "Other / not listed".
      placeholder: 0.1.0 (20260820120000)
  - type: input
    id: os_version
    attributes:
      label: Operating system (name + version)
      description: e.g. macOS 26.5.1 — include platform and version.
      placeholder: macOS 26.5.1
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant configuration
      description: Include pinned apps, jump keys, layout, profile, Space, browser-tab, or display settings that affect the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions first.
          required: true
        - label: I removed private information from logs and attachments.
          required: true
